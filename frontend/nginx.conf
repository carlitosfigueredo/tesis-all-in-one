# ─────────────────────────────────────────
# Nginx — unico servicio expuesto al exterior.
# Sirve el frontend estatico y reenvia /api al backend
# por la red interna de Docker (nunca expuesta).
# HTTPS lo termina Cloudflare por delante; aqui escuchamos en 80.
# ─────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Tamano maximo de subida (importacion CSV de empleados)
    client_max_body_size 12M;

    # Headers de seguridad basicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip para assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ── API: reverse proxy hacia el backend (red interna Docker) ──
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # ── Assets con cache larga (tienen hash en el nombre) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA: cualquier ruta desconocida devuelve index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
