name: Pruebas y evidencia (RF/RNF)

# Ejecuta las pruebas funcionales y no funcionales contra el sistema real
# (backend Node/Express + servicio ML FastAPI + PostgreSQL) levantado en el
# runner, y publica:
#   - un resumen PASS/FAIL en la pagina del run (Job Summary)
#   - los archivos de evidencia como artifact descargable
#   - screenshots PNG de la evidencia (para pegar en documentos)
#   - el reporte publicado en GitHub Pages (URL publica permanente)
#
# Se puede disparar a mano (workflow_dispatch) o en push/PR a main.

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'ml-service/**'
      - 'docs/evidencias-pruebas/scripts/**'
      - '.github/workflows/pruebas-evidencia.yml'
  pull_request:
    branches: [ master ]

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo una publicacion de Pages a la vez (cancelar runs concurrentes de deploy)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Ejecutar pruebas y generar evidencia + screenshots
  # ════════════════════════════════════════════════════════════════════════════
  evidencia:
    runs-on: ubuntu-latest

    # PostgreSQL como servicio del job. La BD es efimera (se destruye al terminar
    # el job); su usuario/clave los tomamos de Secrets con fallback a valores de CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_PG_USER || 'ci_user' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_PG_PASSWORD || 'ci_pass_ephemeral' }}
          POSTGRES_DB: ${{ secrets.CI_PG_DB || 'tesis_bi_db' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # ── Infra de la BD efimera del runner ────────────────────────────────
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: ${{ secrets.CI_PG_USER || 'ci_user' }}
      PGPASSWORD: ${{ secrets.CI_PG_PASSWORD || 'ci_pass_ephemeral' }}
      PGDATABASE: ${{ secrets.CI_PG_DB || 'tesis_bi_db' }}
      DATABASE_URL: postgresql://${{ secrets.CI_PG_USER || 'ci_user' }}:${{ secrets.CI_PG_PASSWORD || 'ci_pass_ephemeral' }}@localhost:5432/${{ secrets.CI_PG_DB || 'tesis_bi_db' }}
      # ── Secretos de la app (definir en Settings > Secrets > Actions) ──────
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      ML_SERVICE_URL: http://localhost:8000
      # Sin RECAPTCHA_SECRET_KEY -> el middleware hace pass-through (modo dev),
      # lo que permite automatizar logins. El rate limiting queda ACTIVO
      # (no seteamos DISABLE_RATE_LIMIT) para poder evidenciar RNF-020.
      NODE_ENV: development
      PORT: '4000'
      BACKEND_URL: http://localhost:4000
      ML_URL: http://localhost:8000
      # ── Credenciales de las cuentas demo (seed) ──────────────────────────
      SEED_SUPERADMIN_EMAIL: ${{ secrets.SEED_SUPERADMIN_EMAIL }}
      SEED_SUPERADMIN_PASSWORD: ${{ secrets.SEED_SUPERADMIN_PASSWORD }}
      SEED_COMPANY_PASSWORD: ${{ secrets.SEED_COMPANY_PASSWORD }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL || 'admin@empresa.com' }}
      SEED_ANALYST_EMAIL: ${{ secrets.SEED_ANALYST_EMAIL || 'analista@empresa.com' }}
      SEED_VIEWER_EMAIL: ${{ secrets.SEED_VIEWER_EMAIL || 'viewer@empresa.com' }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    outputs:
      # Pasa la carpeta de salida al job de Pages
      pages_path: ${{ steps.set-output.outputs.pages_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar que los Secrets requeridos estan definidos
        run: |
          missing=0
          for v in CI_JWT_SECRET SEED_SUPERADMIN_EMAIL SEED_SUPERADMIN_PASSWORD SEED_COMPANY_PASSWORD TEST_USER_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret $v"; missing=1; fi
          done
          [ $missing -eq 0 ] || (echo "Define los Secrets en Settings > Secrets and variables > Actions"; exit 1)
        env:
          CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          SEED_SUPERADMIN_EMAIL: ${{ secrets.SEED_SUPERADMIN_EMAIL }}
          SEED_SUPERADMIN_PASSWORD: ${{ secrets.SEED_SUPERADMIN_PASSWORD }}
          SEED_COMPANY_PASSWORD: ${{ secrets.SEED_COMPANY_PASSWORD }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Instalar cliente de PostgreSQL (psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Servicio ML ──────────────────────────────────────────────────────
      - name: Instalar dependencias del ML service
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Arrancar ML service (background)
        working-directory: ml-service
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > "$GITHUB_WORKSPACE/ml.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/docs > /dev/null; then echo "ML arriba"; break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/docs > /dev/null || (echo "ML no arranco"; cat "$GITHUB_WORKSPACE/ml.log"; exit 1)

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm install

      - name: Prisma generate + migrate + seed
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.js

      - name: Arrancar backend (background)
        working-directory: backend
        run: |
          nohup npm start > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then echo "backend arriba"; break; fi
            sleep 1
          done
          curl -sf http://localhost:4000/api/health > /dev/null || (echo "backend no arranco"; cat "$GITHUB_WORKSPACE/backend.log"; exit 1)

      # ── Entrenar el modelo de la empresa demo (para predict/estado) ──────
      - name: Entrenar modelo ML de la empresa demo
        run: python3 docs/evidencias-pruebas/scripts/train_demo.py

      # ── Ejecutar pruebas y generar evidencia ─────────────────────────────
      - name: Ejecutar pruebas RF/RNF y generar evidencia
        id: pruebas
        env:
          OUTDIR: ${{ github.workspace }}/evidencia-out
        run: python3 docs/evidencias-pruebas/scripts/ci_evidencia.py

      # ── Screenshots con Playwright ────────────────────────────────────────
      # Instala Playwright + Chromium headless y toma capturas del HTML
      # generado. Produce:
      #   - screenshot-completo.png  : pagina entera (scroll) — para el documento
      #   - screenshot-rf.png        : seccion de pruebas funcionales
      #   - screenshot-rnf.png       : seccion de pruebas no funcionales
      #   - screenshot-resumen.png   : cabecera con KPIs (total/pass/fail/%)
      - name: Instalar Playwright + Chromium
        run: |
          npm install -g playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Tomar screenshots del reporte de evidencia
        env:
          OUTDIR: ${{ github.workspace }}/evidencia-out
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const outDir = process.env.OUTDIR;
            const htmlPath = `file://${path.join(outDir, 'evidencia.html')}`;
            const browser = await chromium.launch();
            const page = await browser.newPage();

            // Viewport ancho para que la tabla no se corte
            await page.setViewportSize({ width: 1400, height: 900 });
            await page.goto(htmlPath, { waitUntil: 'networkidle' });

            // 1) Captura completa (pagina entera, scroll)
            await page.screenshot({
              path: path.join(outDir, 'screenshot-completo.png'),
              fullPage: true,
            });

            // 2) Solo la cabecera con KPIs (hero + cards)
            const hero = await page.$('.cards');
            if (hero) {
              // Incluye el hero + las cards de KPIs
              const heroEl = await page.$('.hero');
              const box = await heroEl.boundingBox();
              const cardsBox = await hero.boundingBox();
              await page.screenshot({
                path: path.join(outDir, 'screenshot-resumen.png'),
                clip: {
                  x: 0,
                  y: box.y,
                  width: 1400,
                  height: cardsBox.y + cardsBox.height + 40,
                },
              });
            }

            // 3) Seccion de pruebas funcionales (RF)
            const rfH2 = await page.$('h2:has-text("Funcionales")');
            const rnfH2 = await page.$('h2:has-text("No Funcionales")');
            if (rfH2 && rnfH2) {
              const rfBox  = await rfH2.boundingBox();
              const rnfBox = await rnfH2.boundingBox();
              await page.screenshot({
                path: path.join(outDir, 'screenshot-rf.png'),
                clip: {
                  x: 0,
                  y: rfBox.y - 10,
                  width: 1400,
                  height: rnfBox.y - rfBox.y - 10,
                },
              });
            }

            // 4) Seccion de pruebas no funcionales (RNF)
            if (rnfH2) {
              const rnfBox = await rnfH2.boundingBox();
              const pageH  = await page.evaluate(() => document.body.scrollHeight);
              await page.screenshot({
                path: path.join(outDir, 'screenshot-rnf.png'),
                clip: {
                  x: 0,
                  y: rnfBox.y - 10,
                  width: 1400,
                  height: pageH - rnfBox.y,
                },
              });
            }

            await browser.close();
            console.log('Screenshots generados en', outDir);
          })();
          EOF

      # Inyectar metadatos de la corrida en el HTML (run number, commit, fecha)
      # para que la pagina de Pages muestre de que corrida son los resultados.
      - name: Anotar HTML con metadatos de la corrida
        env:
          OUTDIR: ${{ github.workspace }}/evidencia-out
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, re

          outdir   = os.environ["OUTDIR"]
          run_url  = os.environ["RUN_URL"]
          run_num  = os.environ["RUN_NUMBER"]
          sha      = os.environ["COMMIT_SHA"][:7]

          badge = (
            f'<div style="text-align:center;padding:8px 0 4px;font-size:12px;color:#64748b;">'
            f'Corrida <a href="{run_url}" style="color:#4f46e5;">#{run_num}</a> &nbsp;·&nbsp; '
            f'commit <code>{sha}</code></div>'
          )

          html_path = os.path.join(outdir, "evidencia.html")
          with open(html_path, encoding="utf-8") as f:
              content = f.read()

          # Insertar el badge justo antes del cierre del <footer>
          content = content.replace("</footer>", badge + "\n</footer>")
          with open(html_path, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"HTML anotado con run #{run_num} ({sha})")
          EOF

      # Marcar la carpeta de salida como artefacto de Pages
      - name: Preparar carpeta para GitHub Pages
        id: set-output
        run: echo "pages_path=${{ github.workspace }}/evidencia-out" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: evidencia-out

      # ── Publicar todo como artifact descargable ───────────────────────────
      - name: Subir artifact de evidencia (HTML + TXT + MD + JSON + PNGs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-pruebas
          path: |
            evidencia-out/evidencia.html
            evidencia-out/EVIDENCIA.txt
            evidencia-out/RESUMEN.md
            evidencia-out/resultados.json
            evidencia-out/screenshot-completo.png
            evidencia-out/screenshot-resumen.png
            evidencia-out/screenshot-rf.png
            evidencia-out/screenshot-rnf.png
          if-no-files-found: warn

      - name: Subir logs de servicios (si algo falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-servicios
          path: |
            backend.log
            ml.log
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Publicar en GitHub Pages
  # Solo corre en push/dispatch a master (no en PRs, para no publicar resultados
  # parciales de ramas de trabajo).
  # ════════════════════════════════════════════════════════════════════════════
  deploy-pages:
    needs: evidencia
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      # GitHub rellena esta URL automaticamente con la URL real de Pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
