# ══════════════════════════════════════════════════════════════
# Compose de PRODUCCION — deploy en una sola instancia EC2
#
# Solo el servicio `frontend` (Nginx) publica un puerto al host.
# backend, ml-service y postgres viven en la red interna Docker
# `tesis_network` y NO son alcanzables desde internet.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────
  # Base de datos PostgreSQL — SOLO red interna
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tesis_postgres
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sin `ports:` — la base de datos nunca se expone al host.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tesis_network

  # ─────────────────────────────────────────
  # Backend Node.js + Express — SOLO red interna
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development   # reutilizamos el stage (trae deps + prisma)
    container_name: tesis_backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      ML_SERVICE_URL: http://ml-service:8000
      # SMTP Gmail (demo)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # Pagos
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}
      PYG_TO_USD_RATE: ${PYG_TO_USD_RATE}
      ADAMSPAY_API_KEY: ${ADAMSPAY_API_KEY}
      ADAMSPAY_API_SECRET: ${ADAMSPAY_API_SECRET}
      ADAMSPAY_ENVIRONMENT: ${ADAMSPAY_ENVIRONMENT}
    # Sin `ports:` — solo Nginx (frontend) lo alcanza por la red interna.
    # Sin volumenes de codigo — en produccion se usa la imagen construida.
    # Migraciones al arrancar y luego servidor en modo produccion (sin nodemon).
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm start"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tesis_network

  # ─────────────────────────────────────────
  # Microservicio ML (Python + FastAPI) — SOLO red interna
  # ─────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: tesis_ml
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    # Sin `ports:` — solo el backend lo consume por la red interna.
    # Sin volumen de codigo — se usa la imagen construida (sin --reload).
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - tesis_network

  # ─────────────────────────────────────────
  # Frontend (Nginx) — UNICO servicio expuesto
  # Sirve el build estatico y hace reverse proxy /api -> backend
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID}
    container_name: tesis_frontend
    restart: unless-stopped
    ports:
      - "80:80"   # unico puerto publico; Cloudflare pone el HTTPS por delante
    depends_on:
      - backend
    networks:
      - tesis_network

volumes:
  postgres_data:
    driver: local

networks:
  tesis_network:
    driver: bridge
